pid /tmp/nginx-fact-api.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/fact-api-client;
    fastcgi_temp_path /tmp/fact-api-fastcgi;
    server {
        listen 127.0.0.1:8091;
        server_name localhost;
        root /app/services/fact_api/public;
        client_max_body_size 2m;
        location ^~ /api/barbarito/ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/services/fact_api/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_read_timeout 45s;
        }
        location / { return 404; }
    }
}
